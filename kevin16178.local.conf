<VirtualHost *:80>
    ServerName kevin16178.local
    ServerAlias www.kevin16178.local a1116178.local www.a1116178.local
    ServerAdmin admin@kevin16178.local
    DocumentRoot /var/www/kevin16178.local

    <Directory /var/www/kevin16178.local>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/kevin16178_error.log
    CustomLog ${APACHE_LOG_DIR}/kevin16178_access.log combined
</VirtualHost>
